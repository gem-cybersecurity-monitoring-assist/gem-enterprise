name: Content Studio

# Renders a batch of short-form videos and photo carousels from a JSON post
# spec: real-people Pexels footage, open-source Piper voiceover, captions
# timed to the narration. Free: public-repo Actions minutes, free Pexels API,
# open-source voice. Output is a downloadable artifact; nothing is published.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Post spec to render
        required: true
        default: tools/content-studio/posts/week-1.json
      only:
        description: Render only this post id (optional)
        required: false
        default: ""
      voice:
        description: Piper voice (en_US-lessac-medium, en_US-ryan-high, en_GB-alan-medium)
        required: true
        default: en_US-lessac-medium

permissions:
  contents: read

concurrency:
  group: content-studio
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter fonts-dejavu-core

      - name: Install Python packages
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet numpy pillow piper-tts

      - name: Download voice model
        env:
          VOICE: ${{ inputs.voice }}
        run: |
          case "$VOICE" in
            en_US-lessac-medium|en_US-ryan-high|en_GB-alan-medium) ;;
            *) echo "Unsupported voice: $VOICE" >&2; exit 1 ;;
          esac
          lang="${VOICE%%-*}"; rest="${VOICE#*-}"; name="${rest%-*}"; quality="${rest##*-}"
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/${lang%%_*}/${lang}/${name}/${quality}"
          mkdir -p voices
          curl -fsSL -o "voices/${VOICE}.onnx" "${base}/${VOICE}.onnx"
          curl -fsSL -o "voices/${VOICE}.onnx.json" "${base}/${VOICE}.onnx.json"

      - name: Render batch
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIPER_MODEL: voices/${{ inputs.voice }}.onnx
          SPEC: ${{ inputs.spec }}
          ONLY: ${{ inputs.only }}
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          case "$SPEC" in tools/content-studio/posts/*.json) ;; *) echo "Spec must live in tools/content-studio/posts/" >&2; exit 1 ;; esac
          args=("$SPEC" out)
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          cd tools/content-studio
          python3 gem_reels.py "../../${args[0]}" ../../out "${args[@]:2}"

      - name: Upload rendered content
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: content-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: error
