name: GEM Production Read-Only Health

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-readonly-smoke.yml"
      - "scripts/production-readonly-smoke.mjs"
      - "scripts/production-readonly-smoke.test.mjs"
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

concurrency:
  group: gem-production-readonly-health
  cancel-in-progress: false

jobs:
  verify:
    name: Check public website and gateway health only
    if: github.repository == 'support371/gem-enterprise'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Test monitoring contracts without network access
        run: node --test scripts/production-readonly-smoke.test.mjs

      - name: Read-only production smoke (GET only; no credentials)
        env:
          GEM_SMOKE_URL: https://www.gemcybersecurityassist.com
          GEM_EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/production-readonly-smoke.mjs
