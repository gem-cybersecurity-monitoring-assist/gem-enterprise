name: Copilot Patch Validate and Publish

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: "Existing agent branch to validate"
        required: true
        type: string
        default: "copilot/patch"
      open_pr:
        description: "Open a pull request after validation"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: copilot-validate-${{ inputs.branch_name }}
  cancel-in-progress: true

jobs:
  validate-publish:
    name: Validate Agent Branch
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PATCH_BRANCH: ${{ inputs.branch_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate branch input
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PATCH_BRANCH" || "$PATCH_BRANCH" == -* ]]; then
            echo "Invalid branch name."
            exit 1
          fi
          if [[ "$PATCH_BRANCH" == "main" || "$PATCH_BRANCH" == "master" ]]; then
            echo "Primary branches cannot be used as agent patch branches."
            exit 1
          fi
          git check-ref-format --branch "$PATCH_BRANCH" >/dev/null

      - name: Checkout agent branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch_name }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify agent branch
        env:
          NODE_ENV: test
          JWT_SECRET: TEST_ONLY_AGENT_VALIDATION_SECRET_1234567890
          POSTGRES_PRISMA_URL: postgresql://ci:ci@127.0.0.1:5432/gem_ci
          POSTGRES_URL_NON_POOLING: postgresql://ci:ci@127.0.0.1:5432/gem_ci
          NEXT_PUBLIC_APP_URL: https://www.gemcybersecurityassist.com
          NEXT_PUBLIC_APP_NAME: GEM Enterprise
          NEXT_PUBLIC_AI_DISCLOSURE_TEXT: GEM Concierge is an AI assistant. Responses are informational and require human review for sensitive decisions.
          AUDIT_ENABLED: "true"
          SMTP_HOST: ""
          SMTP_PORT: "587"
          SMTP_USER: ""
          SMTP_PASS: ""
          CRON_SECRET: TEST_ONLY_AGENT_VALIDATION_CRON_SECRET
        run: pnpm run verify:preview

      - name: Open pull request if needed
        if: inputs.open_pr == true
        shell: bash
        run: |
          set -euo pipefail
          if gh pr view "$PATCH_BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "An open pull request already exists for $PATCH_BRANCH."
            exit 0
          fi
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$PATCH_BRANCH" \
            --title "chore: validate agent patch branch" \
            --body "Agent-authored branch validated by pnpm run verify:preview before pull request creation."
