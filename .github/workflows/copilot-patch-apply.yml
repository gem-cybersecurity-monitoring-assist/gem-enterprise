name: Copilot Patch Apply

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: "Branch name to create/update"
        required: true
        type: string
        default: "copilot/patch"
      commit_message:
        description: "Commit message for the patch"
        required: true
        type: string
        default: "chore: apply Copilot patch"
      patch_base64:
        description: "Base64-encoded git patch"
        required: true
        type: string
      open_pr:
        description: "Open a pull request after applying the patch"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-patch:
    name: Apply Copilot Patch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create or switch to working branch
        run: |
          if git show-ref --verify --quiet refs/heads/${{ inputs.branch_name }}; then
            git checkout ${{ inputs.branch_name }}
          else
            git checkout -b ${{ inputs.branch_name }}
          fi

      - name: Decode patch
        run: |
          echo "${{ inputs.patch_base64 }}" | base64 --decode > copilot.patch

      - name: Validate patch
        run: |
          git apply --check copilot.patch

      - name: Apply patch
        run: |
          git apply copilot.patch

      - name: Commit changes
        run: |
          git add -A
          git commit -m "${{ inputs.commit_message }}" || echo "No changes to commit"

      - name: Push branch
        run: |
          git push origin ${{ inputs.branch_name }}

      - name: Open Pull Request (optional)
        if: ${{ inputs.open_pr == true }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ inputs.branch_name }}
          title: ${{ inputs.commit_message }}
          body: "This PR was automatically generated by the Copilot Patch Apply workflow."
          base: main
