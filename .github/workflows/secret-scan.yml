name: Tracked Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan tracked files for exposed credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Run dependency-free secret scanner
        id: scan
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/security/scan_tracked_secrets.py | tee secret-scan-report.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload redacted scan report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secret-scan-report
          path: secret-scan-report.txt
          if-no-files-found: error
          retention-days: 3

      - name: Enforce scan result
        if: steps.scan.outputs.exit_code != '0'
        run: exit 1
