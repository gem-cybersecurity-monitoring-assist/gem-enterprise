<text x="90" y="522" fill="#D7E1EA" font-family="Inter,Arial,sans-serif" font-size="39">01  Who controls email recovery?</text>
<text x="90" y="590" fill="#D7E1EA" font-family="Inter,Arial,sans-serif" font-size="39">02  Is MFA enabled on key accounts?</text>
<text x="90" y="658" fill="#D7E1EA" font-family="Inter,Arial,sans-serif" font-size="39">03  Are payment changes verified?</text>
<text x="90" y="726" fill="#D7E1EA" font-family="Inter,Arial,sans-serif" font-size="39">04  Have backups been restored?</text>
<text x="90" y="794" fill="#D7E1EA" font-family="Inter,Arial,sans-serif" font-size="39">Review priorities before incidents.</text>
